[project]
name = "Caliptra RTL"

[agent]
provider = "claude"
auth = "subscription"

[sandbox]
image = "booley-sandbox-riscv"
memory = "28g"

# Vivado is not in the Sandbox Image: the host administrator registers a
# Vivado 2025.2 installation and grants it to this Project with `booley eda`
# (see Booley's SANDBOX.md, "Commercial EDA provisioning"), and Booley mounts
# it read-only into the Sandbox.
[eda.vivado]
provisioning = "host"

# Seat Cap: at most one Vivado build at a time; a second fpga run waits.
[jobs.seats]
vivado = 1

[stealth]
enabled = true

[flows.sim]
enabled = true
pass_sentinels = ["* TESTCASE PASSED", "* TEST PASSED"]
fail_sentinels = ["* TESTCASE FAILED", "* TEST FAILED", "ERROR! FW attempted to end the simulation"]
run_cwd = ".booley/runs/sim"
pre_run_commands = ['bash "$BOOLEY_DIR/scripts/build_firmware.sh"']
timeout_ms = 7200000

[flows.lint]
enabled = true
timeout_ms = 900000

[flows.synth]
enabled = true
# Full mapped placement and STA can exceed 90 minutes under shared CPU load.
timeout_ms = 7200000

[flows.fpga]
enabled = true
# fpga_ecc_top: out-of-context Vivado build of ecc_top on a KU5P.
timeout_ms = 3600000

# Reviewer Specialist disabled: design review is out of scope for the
# ecc-area task (an independent reviewer grades the result instead), and it
# cost ~18 min and ~$2-3 per trial, once hitting its turn limit after 650 s.
[specialists.reviewer]
enabled = false
