[project]
name = "Caliptra RTL"

[agent]
provider = "claude"
auth = "subscription"

[sandbox]
image = "booley-sandbox-riscv"
memory = "28g"

[jobs]
heavy_memory = "22g"

[stealth]
enabled = true

[flows.sim]
enabled = true
pass_sentinels = ["* TESTCASE PASSED", "* TEST PASSED"]
fail_sentinels = ["* TESTCASE FAILED", "* TEST FAILED", "ERROR! FW attempted to end the simulation"]
run_cwd = ".booley/runs/sim"
pre_run_commands = ['bash "$BOOLEY_DIR/scripts/build_firmware.sh"']
timeout_ms = 7200000

[flows.lint]
enabled = true
timeout_ms = 900000

[flows.synth]
enabled = true
# Full mapped placement and STA can exceed 90 minutes under shared CPU load.
timeout_ms = 7200000

# Reviewer Specialist disabled: design review is out of scope for the
# ecc-area task (an independent reviewer grades the result instead), and it
# cost ~18 min and ~$2-3 per trial, once hitting its turn limit after 650 s.
[specialists.reviewer]
enabled = false
